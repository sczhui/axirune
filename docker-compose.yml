name: axirune

services:
  axirune:
    image: axirune:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axirune
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    expose:
      - "8080"
    networks:
      - proxy-net
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy-net
      traefik.http.routers.axirune.rule: "Host(`axirune.velhu.com`)"
      traefik.http.routers.axirune.entrypoints: websecure
      traefik.http.routers.axirune.tls: "true"
      traefik.http.routers.axirune.service: axirune
      traefik.http.routers.axirune-legacy.rule: "Host(`nexilume.velhu.com`)"
      traefik.http.routers.axirune-legacy.entrypoints: websecure
      traefik.http.routers.axirune-legacy.tls: "true"
      traefik.http.routers.axirune-legacy.service: axirune
      traefik.http.services.axirune.loadbalancer.server.port: "8080"
      homepage.group: "AI"
      homepage.name: "Axirune Language"
      homepage.icon: "mdi-code-block-braces"
      homepage.href: "https://axirune.velhu.com"
      homepage.description: "可编译、无需模型，含 20 款原创 Arcade 的 AI 原生语言"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy-net:
    external: true
